name: Toolbox QA (no deploy)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/static-routes.test.mjs
      - run: npx --yes playwright install chromium
      - run: npm run test:browser
        env:
          CI: 'true'
          ARTIFACT_DIR: /tmp/artifacts
          TESTED_HEAD_SHA: ${{ github.sha }}
          STATIC_PORT: '5299'